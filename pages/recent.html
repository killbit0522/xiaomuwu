<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>近期新增</title><link rel="stylesheet" href="../site-preferences.css?v=20261010-1"><style>body{margin:0;background:#f2efe9;color:#1c1a17;font:16px/1.7 serif}.recent{max-width:800px;margin:auto;padding:28px 16px 70px}.recent h1{font-size:1.6rem}.recent p{color:#625d55}.recent-list{display:grid;gap:8px}.recent-book{display:flex;justify-content:space-between;gap:12px;padding:13px;border:1px solid #c9c0b3;border-radius:9px;background:#faf8f2;color:inherit;text-decoration:none}.recent-book strong{font-size:1.02rem;color:#171512}.recent-book span{font-size:.8rem;color:#746d63}@media(max-width:600px){.recent-book{align-items:flex-start;flex-direction:column;gap:3px}}</style></head><body><main class="recent"><a href="./catalog.html">← 返回目录</a><h1>近期新增</h1><p>最近入库的 50 本书。</p><div id="recent-list" class="recent-list">正在加载…</div></main><script>(function(){var list=document.getElementById('recent-list');fetch('/api/recent',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(data){var items=data.items||[];list.replaceChildren();items.forEach(function(book){var a=document.createElement('a');a.className='recent-book';a.href='./reader.html?p='+encodeURIComponent(book.searchablePath)+'&title='+encodeURIComponent(book.title)+'&format='+encodeURIComponent(book.format||'txt')+'&return='+encodeURIComponent('/pages/recent.html');var title=document.createElement('strong');title.textContent=book.title;var meta=document.createElement('span');meta.textContent=(book.category||'未分类')+' · '+(book.modifiedAt||'');a.append(title,meta);list.appendChild(a)});if(!list.children.length)list.textContent='暂时没有新书。'}).catch(function(){list.textContent='近期新增加载失败，请稍后重试。'})})();</script><script src="../site-preferences.js?v=20261010-1"></script></body></html>
