<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>小木屋 · 联网找书</title>
  <link rel="stylesheet" href="../site-preferences.css?v=20261023-6">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:#28241f;background:#d8d4cb url('../assets/search-bg.jpg') center/cover fixed;font-family:"Noto Serif SC","Songti SC",serif}.veil{min-height:100vh;padding:18px;background:#eeeae2b8}.wrap{width:min(900px,100%);margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:14px}.head a{color:inherit}.head h1{margin:.4em 0}.intro{line-height:1.8;color:#4e4942}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin:22px 0}.search input,.search button,.result a,.result button{font:inherit;border:1px solid #5d574d;background:#f6f3ed;color:inherit;border-radius:8px;padding:11px 13px}.search button,.result a,.result button{cursor:pointer}.state{min-height:28px}.results{display:grid;gap:10px}.result{padding:15px;background:#f5f1e9e8;border:1px solid #7775;border-radius:12px}.result h2{margin:0 0 7px;font-size:1.08rem}.result p{margin:5px 0;line-height:1.7}.result .source{font-size:.78rem;opacity:.7}.result-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px}.result a{display:inline-block;text-decoration:none}.result button.is-saved{background:#4e594a;color:#fff}.quark-fallback{margin:14px 0;padding:12px 14px;border:1px solid #7777;border-radius:10px;background:#f5f1e9d9;line-height:1.7}.quark-fallback a{display:inline-block;margin-left:.4em;color:inherit;font-weight:700}.notice{margin-top:22px;padding:12px;border-left:3px solid #625b51;background:#f5f1e9b8;font-size:.8rem;line-height:1.7}@media(max-width:520px){.veil{padding:12px 8px}.head h1{font-size:1.55rem}.search{grid-template-columns:1fr}.search button{width:100%}.result{padding:12px}}
  </style>
</head>
<body><div class="veil"><main class="wrap">
  <header class="head"><div><p>公开书源 · 独立服务</p><h1>联网找书</h1></div><a href="./home.html">返回首页</a></header>
  <p class="intro">一次搜索本地书库与中文维基文库、Project Gutenberg、Open Library / Internet Archive 等公开书源。没有卡密也可以浏览书名；阅读卡可阅读和收藏，下载卡可下载本地书。</p>
  <form id="form" class="search"><input id="query" type="search" maxlength="80" autocomplete="off" placeholder="输入书名或作者，例如：红楼梦" aria-label="联网搜索书名或作者"><button type="submit">开始搜索</button></form>
  <p id="state" class="state">请输入书名或作者。</p><h2 id="local-heading" hidden>本地书库</h2><section id="local-results" class="results"></section><h2 id="external-heading" hidden>外部公开书源</h2><section id="results" class="results"></section><p id="quark-fallback" class="quark-fallback" hidden>没有找到合适的站内结果？<a id="quark-link" href="https://quark.sm.cn/" target="_blank" rel="noopener noreferrer">用夸克搜索这个书名</a></p>
  <p class="notice">只接入公开许可或明确标记为公版的书源。单个书源波动时会保留其他结果；正文会短期缓存并统一按 UTF-8 保存，阅读页始终标明来源。不会抓取付费、登录或需要验证码的网站。</p>
</main></div>
<script>
(function(){
  var form=document.getElementById('form'),query=document.getElementById('query'),state=document.getElementById('state'),results=document.getElementById('results'),localResults=document.getElementById('local-results'),localHeading=document.getElementById('local-heading'),externalHeading=document.getElementById('external-heading'),quarkFallback=document.getElementById('quark-fallback'),quarkLink=document.getElementById('quark-link'),controller,accessMode='';
  function readerUrl(item){return './reader.html?'+new URLSearchParams({p:onlinePath(item),title:item.title,format:'txt',onlineId:item.id,source:item.source,sourceUrl:item.sourceUrl,return:'/pages/online-search.html?q='+encodeURIComponent(query.value.trim())});}
  function shelf(){try{var items=JSON.parse(localStorage.getItem('xiaomuwu-shelf')||'[]');return Array.isArray(items)?items:[]}catch(error){return []}}
  function onlinePath(item){return 'online:'+(String(item.id).indexOf(':')>0?item.id:'wikisource:'+item.id)}
  function card(item,local){var node=document.createElement('article');node.className='result';var h=document.createElement('h2');h.textContent=item.title;var snippet=document.createElement('p');snippet.textContent=local?((item.author?'作者：'+item.author+' · ':'')+(item.category||'本地书库')):(item.snippet||'公开作品');var source=document.createElement('p');source.className='source';source.textContent='来源：'+(local?'本地书库':item.source);node.append(h,snippet,source);if(accessMode){var actions=document.createElement('div');actions.className='result-actions';if(accessMode==='reader'){var link=document.createElement('a');link.href=local?'./reader.html?p='+encodeURIComponent(item.searchablePath)+'&title='+encodeURIComponent(item.title)+'&format='+encodeURIComponent(item.format||'txt')+'&return='+encodeURIComponent(location.pathname+location.search):readerUrl(item);link.textContent='站内阅读';actions.appendChild(link);var save=document.createElement('button');save.type='button';function paint(){var path=local?item.searchablePath:onlinePath(item),saved=shelf().some(function(book){return book.searchablePath===path});save.textContent=saved?'已在书架':'加入书架';save.classList.toggle('is-saved',saved);save.disabled=saved}paint();save.onclick=function(){var books=shelf(),path=local?item.searchablePath:onlinePath(item);if(!books.some(function(book){return book.searchablePath===path})){books.push(local?item:{title:item.title,searchablePath:path,format:'txt',category:'联网书籍',onlineId:item.id,source:item.source,sourceUrl:item.sourceUrl});try{localStorage.setItem('xiaomuwu-shelf',JSON.stringify(books))}catch(error){save.textContent='保存失败';return}}paint()};actions.appendChild(save)}else if(accessMode==='download'&&local){var download=document.createElement('a');download.href='/books/'+String(item.searchablePath||'').split('/').map(encodeURIComponent).join('/');download.setAttribute('download','');download.textContent='下载本书';actions.appendChild(download)}if(actions.childNodes.length)node.appendChild(actions)}return node}
  function render(local,external,data){localResults.replaceChildren();results.replaceChildren();localHeading.hidden=!local.length;externalHeading.hidden=!external.length;local.forEach(function(item){localResults.appendChild(card(item,true))});external.forEach(function(item){results.appendChild(card(item,false))});var total=local.length+external.length;quarkLink.href='https://quark.sm.cn/s?q='+encodeURIComponent(query.value.trim());quarkFallback.hidden=accessMode!=='reader'||!query.value.trim()||total>0;if(data.searching){state.textContent=local.length?'本地已找到 '+local.length+' 条，正在继续查询外部公开书源…':'本地暂无匹配，正在查询外部公开书源…';return}if(total){state.textContent='共找到 '+total+' 条结果：本地 '+local.length+' 条，外部 '+external.length+' 条。'+(data.cached?'（使用缓存结果）':'')+(data.partial?'（部分外部书源暂时不可用）':'')+(accessMode?'':' 登录有效卡密后可按卡种阅读、收藏或下载。');return}if(data.sourceErrors&&data.sourceErrors.length){state.textContent='本地没有匹配项，外部书源暂时连不上或没有返回结果，请稍后重试。当前外部检索仅覆盖公开书源，普通网络小说可能搜不到。';return}state.textContent='当前接入的外部检索以公开书源为主，普通网络小说可能搜不到；可换书名/作者再试。'+(accessMode?'':' 登录有效卡密后可按卡种阅读、收藏或下载。')}
  async function search(){var value=query.value.trim();if(!value){state.textContent='请输入书名或作者。';query.focus();return}if(controller)controller.abort();controller=new AbortController();var activeController=controller;results.replaceChildren();localResults.replaceChildren();state.textContent='正在搜索本地书库和多个公开书源…';var timer=setTimeout(function(){activeController.abort()},18000);function request(url){return fetch(url,{cache:'no-store',signal:activeController.signal}).then(async function(r){var body=await r.json();if(!r.ok)throw new Error(body.message||'搜索请求失败');return body}).catch(function(error){if(error.name==='AbortError')throw error;return {items:[],partial:true,sourceErrors:[error.message||'搜索请求失败']}})}try{var localPromise=request('/api/catalog/search?q='+encodeURIComponent(value)),externalPromise=request('/api/online/search?q='+encodeURIComponent(value)),local=await localPromise;if(activeController.signal.aborted)return;render(local.items||[],[],{searching:true});var external=await externalPromise;if(activeController.signal.aborted)return;render(local.items||[],external.items||[],external);history.replaceState(null,'','?q='+encodeURIComponent(value))}catch(error){state.textContent=error.name==='AbortError'?'搜索超时，请稍后重试。':'搜索暂时不可用，请稍后重试。'}finally{clearTimeout(timer)}}
  form.addEventListener('submit',function(event){event.preventDefault();search()});fetch('/api/access',{cache:'no-store'}).then(function(r){return r.json()}).then(function(info){accessMode=info.ok?info.cardType:'';var initial=new URLSearchParams(location.search).get('q');if(initial){query.value=initial;search()}}).catch(function(){var initial=new URLSearchParams(location.search).get('q');if(initial){query.value=initial;search()}})
})();
</script><script src="../site-preferences.js?v=20261023-6"></script>
</body></html>
