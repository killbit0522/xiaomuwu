<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>木木有话说</title><link rel="stylesheet" href="../site-preferences.css?v=20261023-4"><style>body{margin:0;background:#f2efe9;color:#1c1a17;font:16px/1.7 serif}.message-main{box-sizing:border-box;max-width:820px;margin:auto;padding:28px 16px 72px}.message-back{color:inherit}.message-title{margin:22px 0 4px;font-size:1.65rem}.message-sub{margin:0 0 22px;color:#6b655d}.message-list{display:grid;gap:14px}.message-item{padding:18px;border:1px solid #c9c0b3;border-radius:12px;background:#faf8f2}.message-item h2{margin:0 0 6px;font-size:1.15rem}.message-item time{display:block;color:#746d63;font-size:.8rem}.message-item p{margin:12px 0 0;white-space:pre-wrap;word-break:break-word}.message-item img{display:block;max-width:100%;max-height:46dvh;object-fit:contain;margin:12px 0 0;border-radius:8px}@media(max-width:600px){.message-main{padding:20px 12px 60px}.message-item{padding:15px}}</style></head><body><main class="message-main"><a class="message-back" href="./catalog.html">← 返回目录</a><h1 class="message-title">木木有话说</h1><p class="message-sub">这里会一直保留管理员写给会员的消息。</p><section id="message-list" class="message-list" aria-live="polite">正在加载消息…</section></main><script>(function(){var list=document.getElementById('message-list');function empty(text){list.textContent=text}fetch('/api/messages',{cache:'no-store'}).then(function(response){if(!response.ok)throw Error();return response.json()}).then(function(data){var items=Array.isArray(data.items)?data.items:[];list.replaceChildren();items.forEach(function(item){var row=document.createElement('article'),title=document.createElement('h2'),time=document.createElement('time'),body=document.createElement('p');row.className='message-item';title.textContent=item.title||'未命名';time.textContent=(item.updatedAt||'').replace('T',' ').replace(/\.\d+\+00:00$/,'');body.textContent=item.body||'';row.append(title,time);if(item.imageUrl){var image=document.createElement('img');image.src=item.imageUrl;image.alt='';image.loading='lazy';row.appendChild(image)}row.appendChild(body);list.appendChild(row)});if(!items.length)empty('暂时还没有消息。')}).catch(function(){empty('消息暂时加载失败，请稍后重试。')})})();</script><script src="../site-preferences.js?v=20261023-4"></script></body></html>
