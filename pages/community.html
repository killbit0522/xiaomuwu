<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>木木小广场</title><link rel="stylesheet" href="../site-preferences.css?v=20261023-5"><style>body{margin:0;background:#f2efe9;color:#1c1a17;font:16px/1.7 serif}.community-main{box-sizing:border-box;max-width:820px;margin:auto;padding:28px 16px 72px}.community-back{color:inherit}.community-title{margin:22px 0 4px;font-size:1.65rem}.community-sub{margin:0 0 22px;color:#6b655d}.community-list{display:grid;gap:16px}.community-post{padding:18px;border:1px solid #c9c0b3;border-radius:12px;background:#faf8f2}.community-post h2{margin:0 0 6px;font-size:1.18rem}.community-post time,.community-comments-title{display:block;color:#746d63;font-size:.8rem}.community-post-body,.community-comment p{margin:12px 0;white-space:pre-wrap;word-break:break-word}.community-image{display:block;max-width:100%;max-height:56dvh;object-fit:contain;margin:12px 0;border-radius:8px;background:#eee}.community-comments{border-top:1px solid #ddd2c3;margin-top:14px;padding-top:12px}.community-comment{padding:9px 0;border-bottom:1px solid #e3dbcf}.community-comment:last-of-type{border-bottom:0}.community-comment p{margin:0}.community-form{display:grid;gap:8px;margin-top:12px}.community-form textarea{min-height:64px;box-sizing:border-box;width:100%;font:inherit;padding:9px;border:1px solid #978d80;background:#fff}.community-form button{justify-self:end;padding:8px 13px;background:#fff;border:1px solid #4b4339;border-radius:6px;font:inherit}.community-status{font-size:.84rem;color:#746d63}@media(max-width:600px){.community-main{padding:20px 12px 60px}.community-post{padding:15px}}</style></head><body><main class="community-main"><a class="community-back" href="./catalog.html">← 返回目录</a><h1 class="community-title">木木小广场</h1><p class="community-sub">木木分享日常感受的地方。会员可以在每条动态下留言交流，请友善发言。</p><section id="community-list" class="community-list" aria-live="polite">正在加载动态…</section></main><script>(function(){var list=document.getElementById('community-list');function note(text){list.textContent=text}function formatTime(value){return String(value||'').replace('T',' ').replace(/\.\d+\+00:00$/,'')}function comment(post,body){var form=document.createElement('form'),input=document.createElement('textarea'),button=document.createElement('button'),status=document.createElement('span');form.className='community-form';input.maxLength=500;input.required=true;input.placeholder='写下你的感受（最多 500 字）';button.type='submit';button.textContent='发布评论';status.className='community-status';form.append(input,button,status);form.onsubmit=function(event){event.preventDefault();var value=input.value.trim();if(!value)return;button.disabled=true;status.textContent='正在发布…';fetch('/api/community/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({postId:post.id,body:value})}).then(function(response){if(!response.ok)throw Error();return response.json()}).then(function(){input.value='';status.textContent='已发布。';load()}).catch(function(){status.textContent='发布失败，请确认卡密仍有效后重试。'}).finally(function(){button.disabled=false})};return form}function load(){fetch('/api/community',{cache:'no-store'}).then(function(response){if(!response.ok)throw Error();return response.json()}).then(function(data){var posts=Array.isArray(data.items)?data.items:[];list.replaceChildren();posts.forEach(function(post){var card=document.createElement('article'),title=document.createElement('h2'),time=document.createElement('time'),body=document.createElement('p'),comments=document.createElement('section'),commentsTitle=document.createElement('strong');card.className='community-post';title.textContent=post.title||'木木有话说';time.textContent=formatTime(post.created_at);body.className='community-post-body';body.textContent=post.body||'';card.append(title,time);if(post.image_url){var image=document.createElement('img');image.className='community-image';image.src=post.image_url;image.alt='动态配图';image.loading='lazy';image.decoding='async';card.appendChild(image)}card.appendChild(body);comments.className='community-comments';commentsTitle.className='community-comments-title';commentsTitle.textContent='会员留言 '+((post.comments||[]).length)+' 条';comments.appendChild(commentsTitle);(post.comments||[]).forEach(function(item){var row=document.createElement('article'),text=document.createElement('p'),date=document.createElement('time');row.className='community-comment';text.textContent=item.body||'';date.textContent=formatTime(item.created_at);row.append(text,date);comments.appendChild(row)});comments.appendChild(comment(post));card.appendChild(comments);list.appendChild(card)});if(!posts.length)note('木木还没有发布动态，过一会儿再来看看吧。')}).catch(function(){note('动态暂时加载失败，请确认卡密仍有效后刷新重试。')})}load()})();</script><script src="../site-preferences.js?v=20261023-5"></script></body></html>
