/* ==========================================================================
   Palette note
   These tokens are sampled from the artwork supplied for this project, not
   invented. Measured mean colours of the source images:
     IMG_1939 home hero        #766952   (dark warm olive)
     IMG_1948 home fill        #ccc9c3   (neutral warm grey)
     IMG_1949 left rail/search #c2bfba   (neutral warm grey)
     IMG_1950 catalog          #dfdcd5   (pale neutral grey)
     IMG_1950-2 request        #c7c4be   (neutral warm grey)
     IMG_1952 review           #f3f3f3   (near white)
     IMG_1947 birds            #e8e9e9   (near white)
   The artwork is neutral paper, so the page base is a neutral paper grey.
   No cream / yellow cast is applied anywhere.
   ========================================================================== */

:root {
  /* Neutral paper base taken from the artwork itself */
  --zhaowen-background: #c9c5be;
  --zhaowen-foreground: #1c1a17;

  --zhaowen-card: #f2efe9;
  --zhaowen-card-foreground: #1c1a17;
  --zhaowen-popover: #f7f5f0;
  --zhaowen-popover-foreground: #1c1a17;

  /* Ink, not red. Buttons are transparent with black text. */
  --zhaowen-primary: #1c1a17;
  --zhaowen-primary-foreground: #f7f5f0;

  --zhaowen-muted: #d9d5ce;
  --zhaowen-muted-foreground: #5f5a52;
  --zhaowen-border: rgba(28, 26, 23, 0.22);
  --zhaowen-input: rgba(28, 26, 23, 0.06);
  --zhaowen-ring: #1c1a17;

  /* Radius scale - restrained */
  --zhaowen-radius-sm: 3px;
  --zhaowen-radius-md: 6px;
  --zhaowen-radius-lg: 14px;

  /* Semantic surfaces */
  --zhaowen-surface-1: #d5d1ca;
  --zhaowen-surface-2: #dedad3;
  --zhaowen-surface-3: #e7e3dc;
  --zhaowen-ink-1: #1c1a17;
  --zhaowen-ink-2: #443f38;
  --zhaowen-ink-3: #6b655c;
  --zhaowen-line: rgba(28, 26, 23, 0.22);

  /* Per-page base tone. Each page overrides this with the tone of the
     artwork used on that page, so the page never fights its own image. */
  --zhaowen-page-base: #c9c5be;
  /* How strongly the artwork shows through. Kept high so images are not washed out. */
  --zhaowen-art-opacity: 0.92;
  --zhaowen-art-blur: 0px;

  /* Secondary accent kept neutral; legacy name retained for compatibility */
  --zhaowen-seal: #1c1a17;
  --zhaowen-ink-blue: #2f3a3d;
  --zhaowen-gold: #6d6450;

  /* Neutral whites: paper glow washes and the 木木书屋 orb shell.
     Declared here so page HTML/CSS never needs a literal colour value. */
  --zhaowen-glow: #ffffff;
  --zhaowen-orb-base: #f1efeb;
  --zhaowen-orb-highlight: #fdfcfa;
  --zhaowen-orb-shade: #dcd8d1;

  /* Layout rhythm */
  --zhaowen-section-gap: 2.5rem;
  --zhaowen-card-pad: 1.5rem;

  /* Typography
     Display = Mincho (明朝体); Body = Source Han Serif (思源宋体). */
  --zhaowen-font-display: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Hiragino Mincho Pro",
    "MS PMincho", "Source Han Serif SC", "Noto Serif SC", "Songti SC", "SimSun", serif;
  --zhaowen-font-serif: "Source Han Serif SC", "Noto Serif SC", "Source Han Serif",
    "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Songti SC", "STSong", "SimSun", serif;
  --zhaowen-font-sans: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --zhaowen-font-mono: "JetBrains Mono", "SF Mono", "Fira Code", monospace;

  /* Slightly reduced type scale */
  --zhaowen-text-xs: 0.68rem;
  --zhaowen-text-sm: 0.78rem;
  --zhaowen-text-base: 0.88rem;
  --zhaowen-text-lg: 1.02rem;
  --zhaowen-text-xl: 1.3rem;
  --zhaowen-text-2xl: 1.72rem;
  --zhaowen-text-3xl: 2.05rem;
}

html {
  color-scheme: light;
}

body {
  font-family: var(--zhaowen-font-serif);
  background-color: var(--zhaowen-page-base);
  color: var(--zhaowen-foreground);
  font-size: var(--zhaowen-text-base);
}

h1, h2, h3, h4 {
  font-family: var(--zhaowen-font-display);
  font-weight: 500;
}

<body class="sh-body">
<style id="critical-layout">
  /* =====================================================================
     藏书阁 · 缺书登记页 — 静态关键布局样式
     不依赖 Tailwind 运行时编译：Tailwind 延迟或失败时本页仍不塌陷、不重叠
     · 页底取本页主图 request-bg.jpg 实测均值 #c7c4be，无米黄
     · 底图 opacity ≥ 0.94，仅四条边最外侧 9% 羽化，中心清晰
     · 可读性由「局部径向柔光垫」承担，无整幅压盖层
     · 交互按钮：透明底 + 黑字 + 1px 黑描边
     ===================================================================== */
  :root{
    --zhaowen-page-base: #c7c4be;
    --zhaowen-art-opacity: 0.94;
  }

  *, *::before, *::after { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html { background: var(--zhaowen-page-base); }

  body.sh-body {
    margin: 0;
    min-height: 100vh;
    max-width: 100%;
    overflow-x: hidden;
    background: var(--zhaowen-page-base);
    color: var(--zhaowen-ink-1);
    font-family: var(--zhaowen-font-serif);
    font-size: var(--zhaowen-text-base);
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .sh-shell :focus-visible {
    outline: 2px solid var(--zhaowen-ink-1);
    outline-offset: 2px;
    border-radius: var(--zhaowen-radius-sm);
  }

  /* 图标基座：lucide 未加载时也占位不塌陷 */
  .sh-nav-ico {
    display: inline-block;
    width: 18px;
    height: 18px;
    flex: 0 0 auto;
    color: inherit;
  }

  /* ---------------- 共享外壳：左栏 sticky + 右栏文档流 ---------------- */
  .sh-shell {
    display: flex;
    align-items: flex-start;
    width: 100%;
    max-width: 100%;
    min-height: 100vh;
    background: var(--zhaowen-page-base);
  }

  .sh-side {
    position: sticky;
    top: 0;
    flex: 0 0 300px;
    width: 300px;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    border-right: 1px solid color-mix(in srgb, var(--zhaowen-line) 42%, transparent);
    /* 与主栏同底色 → 两栏底图在交界处同一基色，不产生生硬色块 */
    background: var(--zhaowen-page-base);
    isolation: isolate;
    z-index: 6;
  }
  .sh-side::-webkit-scrollbar { width: 6px; }
  .sh-side::-webkit-scrollbar-track { background: transparent; }
  .sh-side::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--zhaowen-ink-3) 40%, transparent);
    border-radius: 3px;
  }

  /* 左栏底图：mix-blend-mode 叠合，满幅可见 */
  .sh-side-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image: url("../assets/sidebar-bg.jpg");
    background-size: cover;
    background-position: center 28%;
    background-repeat: no-repeat;
    opacity: var(--zhaowen-art-opacity);
    mix-blend-mode: multiply;
    pointer-events: none;
    /* 只羽化左 / 上 / 下三条外边；右边缘保持满幅，接入主栏左缘 */
    -webkit-mask-image:
      linear-gradient(to right, transparent 0%, #000 9%, #000 100%),
      linear-gradient(to bottom, transparent 0%, #000 9%, #000 91%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent 0%, #000 9%, #000 100%),
      linear-gradient(to bottom, transparent 0%, #000 9%, #000 91%, transparent 100%);
    mask-composite: intersect;
  }

  .sh-side-inner {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    min-height: 100vh;
    padding: 1.9rem 1.3rem 1.6rem;
  }

  /* 侧栏文字局部柔光垫：径向羽化，尺寸贴合内容列并向外渐隐到 transparent */
  .sh-side-inner::before {
    content: "";
    position: absolute;
    inset: 1.1rem 0.55rem 0.9rem 0.35rem;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(
      96% 74% at 44% 44%,
      color-mix(in srgb, var(--zhaowen-page-base) 60%, transparent) 0%,
      color-mix(in srgb, var(--zhaowen-page-base) 38%, transparent) 58%,
      transparent 100%
    );
  }

  /* 品牌区 */
  .sh-brand {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding-bottom: 1.3rem;
    border-bottom: 1px solid color-mix(in srgb, var(--zhaowen-line) 78%, transparent);
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .sh-brand:focus-visible { outline: 2px solid var(--zhaowen-ink-1); outline-offset: 3px; }
  .sh-seal {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid var(--zhaowen-ink-1);
    color: var(--zhaowen-ink-1);
    font-family: var(--zhaowen-font-display);
    font-size: 1.28rem;
    line-height: 1;
    border-radius: var(--zhaowen-radius-sm);
  }
  .sh-brand-text { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
  .sh-brand-title {
    font-family: var(--zhaowen-font-display);
    font-size: 1.16rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    line-height: 1.3;
    color: var(--zhaowen-ink-1);
  }
  .sh-brand-sub {
    font-family: var(--zhaowen-font-sans);
    font-size: 0.66rem;
    letter-spacing: 0.13em;
    color: var(--zhaowen-ink-2);
  }

  /* 导航 */
  .sh-nav {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .sh-nav-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.92rem 0.9rem 0.92rem 1.05rem;
    border-top: 1px solid color-mix(in srgb, var(--zhaowen-line) 78%, transparent);
    color: var(--zhaowen-ink-1);
    text-decoration: none;
    transition: transform 0.18s ease, background-color 0.18s ease, color 0.18s ease;
  }
  .sh-nav-btn:last-child { border-bottom: 1px solid color-mix(in srgb, var(--zhaowen-line) 78%, transparent); }
  .sh-nav-btn::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--zhaowen-ink-1);
    opacity: 0;
    transition: opacity 0.18s ease;
  }
  .sh-nav-btn:hover {
    transform: translateX(2px);
    background: color-mix(in srgb, var(--zhaowen-ink-1) 7%, transparent);
    color: var(--zhaowen-ink-1);
  }
  .sh-nav-btn:hover::before { opacity: 1; }
  .sh-nav-btn.is-active {
    background: color-mix(in srgb, var(--zhaowen-ink-1) 9%, transparent);
    color: var(--zhaowen-ink-1);
    font-weight: 600;
  }
  .sh-nav-btn.is-active::before { opacity: 1; }
  .sh-nav-label {
    flex: 1 1 auto;
    min-width: 0;
    font-family: var(--zhaowen-font-serif);
    font-size: 1rem;
    letter-spacing: 0.1em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sh-nav-en {
    flex: 0 0 auto;
    font-family: var(--zhaowen-font-mono);
    font-size: 0.64rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--zhaowen-ink-2);
  }

  /* 分类标签行 */
  .sh-cats {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    padding-top: 0.15rem;
  }
  .sh-cat {
    display: inline-block;
    padding: 0.24rem 0.62rem;
    border: 1px solid color-mix(in srgb, var(--zhaowen-ink-1) 46%, transparent);
    border-radius: 999px;
    background: transparent;
    font-family: var(--zhaowen-font-sans);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--zhaowen-ink-2);
  }

  .sh-side-foot {
    margin-top: auto;
    padding-top: 1.1rem;
    border-top: 1px solid color-mix(in srgb, var(--zhaowen-line) 78%, transparent);
    font-family: var(--zhaowen-font-sans);
    font-size: 0.68rem;
    line-height: 1.8;
    letter-spacing: 0.1em;
    color: var(--zhaowen-ink-2);
  }

  /* ---------------- 主栏 ---------------- */
  .sh-main {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 100vh;
    background: var(--zhaowen-page-base);
    /* 隔离混合组：主栏底图只与主栏底色叠合，不跨栏渗色 */
    isolation: isolate;
  }

  /* 满铺底图（唯一允许的绝对定位排版），透明底整体拉高 */
  .rq-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .rq-bg-img {
    position: absolute;
    inset: 0;
    background-image: url("../assets/request-bg.jpg");
    background-size: cover;
    background-position: center 44%;
    background-repeat: no-repeat;
    opacity: var(--zhaowen-art-opacity);
    mix-blend-mode: multiply;
    /* 仅四条边最外侧 9% 羽化，画面中心完全清晰 */
    -webkit-mask-image:
      linear-gradient(to right, transparent 0%, #000 9%, #000 91%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, #000 9%, #000 91%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent 0%, #000 9%, #000 91%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, #000 9%, #000 91%, transparent 100%);
    mask-composite: intersect;
  }
  /* 两栏咬合层：左栏底图以 multiply 延伸进主栏左缘并向右渐隐，
     与主栏底图交叉过渡，交界处无生硬色块分界 */
  .rq-bg-seam {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 12%;
    background-image: url("../assets/sidebar-bg.jpg");
    background-size: cover;
    background-position: center 30%;
    background-repeat: no-repeat;
    opacity: var(--zhaowen-art-opacity);
    mix-blend-mode: multiply;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to right, #000 0%, rgba(0, 0, 0, 0.52) 46%, transparent 100%);
    mask-image: linear-gradient(to right, #000 0%, rgba(0, 0, 0, 0.52) 46%, transparent 100%);
  }

  /* ---------------- 内容层 ---------------- */
  .rq-wrap {
    position: relative;
    z-index: 2;
    max-width: 820px;
    margin: 0 auto;
    padding: 3.6rem 2rem 4.5rem;
  }

  /* 标题块局部柔光垫：径向羽化，尺寸刚好包住文字块并向外渐隐到 transparent */
  .rq-head { position: relative; }
  .rq-head::before {
    content: "";
    position: absolute;
    inset: -1.3rem -1.8rem -1.5rem -1.5rem;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(
      116% 130% at 30% 46%,
      color-mix(in srgb, var(--zhaowen-page-base) 66%, transparent) 0%,

<script>
(function () {
  var form = document.getElementById('request-form-el');
  var success = document.getElementById('rq-success');
  if (!form || !success) { return; }

  var titleField = document.getElementById('rq-title');
  var authorField = document.getElementById('rq-author');
  var resetBtn = document.getElementById('rq-reset');
  var againBtn = document.getElementById('rq-again');

  var PAIRS = [];
  var allFields = form.querySelectorAll('input, select, textarea');
  for (var i = 0; i < allFields.length; i++) {
    PAIRS.push({
      field: allFields[i],
      err: document.getElementById(allFields[i].getAttribute('aria-describedby') || '')
    });
  }

  function showError(entry, message) {
    if (!entry) { return; }
    if (entry.err) {
      entry.err.textContent = message;
      entry.err.hidden = false;
    }
    if (entry.field && entry.field.classList) {
      entry.field.classList.add('is-invalid');
      entry.field.setAttribute('aria-invalid', 'true');
    }
  }

  function clearError(entry) {
    if (!entry || !entry.field) { return; }
    entry.field.classList.remove('is-invalid');
    entry.field.removeAttribute('aria-invalid');
    if (entry.err) {
      entry.err.textContent = '';
      entry.err.hidden = true;
    }
  }

  function clearAllErrors() {
    for (var i = 0; i < PAIRS.length; i++) { clearError(PAIRS[i]); }
  }

  function entryFor(field) {
    for (var i = 0; i < PAIRS.length; i++) {
      if (PAIRS[i].field === field) { return PAIRS[i]; }
    }
    return null;
  }

  function isContactValid(value) {
    var raw = String(value || '').trim();
    if (raw === '') { return false; }
    if (raw.indexOf('@') !== -1) { return true; }
    return raw.replace(/[^0-9]/g, '').length === 11;
  }

  function showForm() {
    form.hidden = false;
    success.hidden = true;
  }

  function visitorId() {
    try { var key='cabin-visitor-id',value=localStorage.getItem(key);if(!value){value=Math.random().toString(36).slice(2);localStorage.setItem(key,value)}return value; }
    catch(error){ return 'visitor'; }
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();

    var titleValue = titleField ? titleField.value.trim() : '';
    var authorValue = authorField ? authorField.value.trim() : '';
    var firstBad = null;

    if (titleValue === '') {
      showError(entryFor(titleField), '请填写书名。');
      firstBad = firstBad || titleField;
    } else {
      clearError(entryFor(titleField));
    }

    if (authorValue === '') {
      showError(entryFor(authorField), '请填写作者；不清楚可填写“未知”。');
      firstBad = firstBad || authorField;
    } else {
      clearError(entryFor(authorField));
    }

    if (firstBad) {
      firstBad.focus();
      return;
    }

    clearAllErrors();
    var data = new FormData(form);
    var submit = form.querySelector('[type="submit"]');
    if (submit) { submit.disabled = true; submit.textContent = '正在提交…'; }
    fetch('/api/requests', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title:titleValue,author:authorValue,visitor:visitorId()}) })
      .then(function(response){ if(!response.ok){throw new Error('submit')} form.hidden=true;success.hidden=false;if(againBtn){againBtn.focus()} })
      .catch(function(){ showError(entryFor(titleField),'提交失败，请稍后再试。');titleField.focus(); })
      .finally(function(){ if(submit){submit.disabled=false;submit.textContent='提交登记'} });
  });

  if (resetBtn) {
    resetBtn.addEventListener('click', function () {
      form.reset();
      clearAllErrors();
      showForm();
      if (titleField) { titleField.focus(); }
    });
  }

  if (againBtn) {
    againBtn.addEventListener('click', function () {
      form.reset();
      clearAllErrors();
      showForm();
      if (titleField) { titleField.focus(); }
    });
  }

  function watch(field) {
    if (!field) { return; }
    var eventName = (field.tagName === 'SELECT' || field.type === 'radio' || field.type === 'checkbox')
      ? 'change'
      : 'input';
    field.addEventListener(eventName, function () {
      clearError(entryFor(field));
    });
  }

  for (var k = 0; k < allFields.length; k++) { watch(allFields[k]); }
})();
</script>
