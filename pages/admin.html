<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小木屋 · 管理后台</title>
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="../site-preferences.css"><style>
body{margin:0;background:#c9c5be;color:#1c1a17;font-family:serif}.wrap{max-width:1100px;margin:auto;padding:34px 22px}.panel{background:#f2efe9;border:1px solid rgba(28,26,23,.22);border-radius:14px;padding:22px;margin:18px 0}.panel>h2{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:0}.panel.is-collapsed{padding-bottom:12px}.panel.is-collapsed>:not(h2){display:none!important}.panel-toggle{flex:0 0 auto;padding:6px 11px;border-radius:999px;font-size:.78rem}.panel-tools{display:flex;justify-content:flex-end;gap:8px;margin:14px 0}.panel-tools button{padding:7px 12px;border-radius:999px;font-size:.8rem}.row{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:120px;padding:15px;border:1px solid rgba(28,26,23,.18)}input,button{padding:10px;border:1px solid #444;background:#fff;font:inherit}button{cursor:pointer}.item{padding:12px 0;border-bottom:1px solid rgba(28,26,23,.15)}.muted{color:#665f55;font-size:.82rem}.review-body{white-space:pre-wrap;line-height:1.65}a{color:inherit}.generator{align-items:end}.field{display:grid;gap:6px;min-width:170px}.result{margin-top:10px;padding:8px 14px;background:rgba(255,255,255,.48);word-break:break-all}.generated-title{margin:8px 0 4px}.generated-card{display:grid;grid-template-columns:3rem minmax(150px,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(28,26,23,.14)}.generated-card:last-child{border-bottom:0}.generated-no{text-align:center;color:#665f55}.generated-card code{font-size:.9rem}.result-tools{display:flex;justify-content:flex-end;margin-top:16px}.result-tools[hidden]{display:none}.copy-btn{padding:6px 10px;font-size:.78rem;white-space:nowrap}.cards{width:100%;border-collapse:collapse;font-size:.86rem}.cards th,.cards td{text-align:left;padding:9px;border-bottom:1px solid rgba(28,26,23,.14)}.cards code{font-size:.82rem}.exhausted{color:#8a3434}@media(max-width:650px){.cards{display:block;overflow:auto}.wrap{padding:24px 14px}.panel{padding:16px}.panel>h2{font-size:1.16rem}.generated-card{grid-template-columns:2.2rem minmax(120px,1fr) auto;gap:6px}}
</style></head><body><main class="wrap"><a href="./home.html">← 返回小木屋</a><h1>管理后台</h1>
<section id="login" class="panel"><form id="login-form"><label>管理员卡密 <input id="admin-code" type="password" required></label> <button>进入后台</button></form><p id="login-error" hidden>管理员卡密不正确。</p></section>
<div id="dashboard" hidden><div class="panel-tools"><button id="collapse-all" type="button">全部收起</button><button id="expand-all" type="button">全部展开</button></div><div class="row" id="stats"></div>
<section class="panel"><h2>卡密生成</h2><h3>下载卡 · 按次数</h3><p class="muted">只能下载本地书，不能在线阅读本地书或加入书架；外部在线搜索不受影响。</p><form id="download-card-form" class="row generator"><label class="field">生成数量<input id="download-card-count" type="number" min="1" max="500" value="10" required></label><label class="field">每张下载次数<input id="card-limit" type="number" min="1" max="10000" value="1" required></label><button type="submit">生成下载卡</button></form><h3>阅读卡 · 按时间</h3><p class="muted">可在线阅读本地书并加入书架，不能下载本地文件。</p><form id="reader-card-form" class="row generator"><label class="field">生成数量<input id="reader-card-count" type="number" min="1" max="500" value="10" required></label><label class="field">有效月数<input id="reader-card-months" type="number" min="1" max="36" value="1" required></label><button type="submit">生成阅读卡</button></form><p id="card-error" class="exhausted" hidden></p><div id="card-result-tools" class="result-tools" hidden><button id="copy-all-cards" class="copy-btn" type="button">一键复制全部</button></div><div id="card-result" class="result" hidden></div></section>
<section class="panel"><h2>修改管理员密码</h2><p class="muted">初始密码为 MUMU-ADMIN-2026。新密码至少 8 位，请修改后妥善保存。</p><form id="password-form" class="row generator"><label class="field">新密码<input id="new-admin-password" type="password" minlength="8" maxlength="128" required></label><label class="field">再次输入<input id="confirm-admin-password" type="password" minlength="8" maxlength="128" required></label><button type="submit">保存新密码</button></form><p id="password-message" class="muted" hidden></p></section>
<section class="panel"><h2>卡密使用情况</h2><div style="overflow:auto"><table class="cards"><thead><tr><th>序号</th><th>卡密</th><th>类型</th><th>额度/期限</th><th>已使用</th><th>状态</th><th>生成时间</th><th>操作</th></tr></thead><tbody id="card-list"></tbody></table></div></section>
<section class="panel"><h2>缺书登记与上传</h2><p class="muted">用户提交后实时同步；你可在这里上传文档，上传后自动进入书目。</p><form id="upload-form" class="row generator"><label class="field">选择文档<input id="upload-file" type="file" accept=".txt,.docx,.zip,.rar,.7z,.pdf,.epub,.mobi" required></label><button type="submit">上传到书库</button><span id="upload-message" class="muted"></span></form><div id="book-requests"></div></section><section class="panel"><h2>用户动态</h2><div id="events"></div></section><section class="panel"><h2>读后感</h2><div id="reviews"></div></section></div></main>
<script src="../site-preferences.js"></script><script>
(function(){var login=document.getElementById('login'),dashboard=document.getElementById('dashboard'),stats=document.getElementById('stats'),events=document.getElementById('events'),reviews=document.getElementById('reviews'),bookRequests=document.getElementById('book-requests'),cardList=document.getElementById('card-list'),cardResult=document.getElementById('card-result'),cardResultTools=document.getElementById('card-result-tools'),copyAllCards=document.getElementById('copy-all-cards'),cardError=document.getElementById('card-error'),lastGeneratedCodes=[];
function text(tag,value,cls){var el=document.createElement(tag);el.textContent=value;if(cls)el.className=cls;return el}
function initCollapsibles(){var key='xiaomuwu-admin-collapsed',saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}var panels=Array.prototype.slice.call(dashboard.querySelectorAll('.panel'));function setPanel(panel,collapsed){panel.classList.toggle('is-collapsed',collapsed);var button=panel.querySelector('.panel-toggle');if(button){button.textContent=collapsed?'展开':'收起';button.setAttribute('aria-expanded',collapsed?'false':'true')}}function persist(){var state={};panels.forEach(function(panel){state[panel.dataset.panelKey]=panel.classList.contains('is-collapsed')});try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}panels.forEach(function(panel,index){var heading=panel.querySelector(':scope > h2');if(!heading)return;var panelKey='panel-'+index+'-'+heading.textContent.trim();panel.dataset.panelKey=panelKey;var button=document.createElement('button');button.type='button';button.className='panel-toggle';button.setAttribute('aria-label','收起或展开'+heading.textContent.trim());heading.appendChild(button);setPanel(panel,!!saved[panelKey]);button.onclick=function(){setPanel(panel,!panel.classList.contains('is-collapsed'));persist()}});document.getElementById('collapse-all').onclick=function(){panels.forEach(function(panel){setPanel(panel,true)});persist()};document.getElementById('expand-all').onclick=function(){panels.forEach(function(panel){setPanel(panel,false)});persist()}}
function copyText(value,button){function done(){var original=button.textContent;button.textContent='已复制';button.disabled=true;setTimeout(function(){button.textContent=original;button.disabled=false},1400)}function fallback(){var area=document.createElement('textarea');area.value=value;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();try{document.execCommand('copy');done()}finally{area.remove()}}if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(value).then(done).catch(fallback)}else{fallback()}}
function render(data){login.hidden=true;dashboard.hidden=false;stats.replaceChildren();[['独立访客',data.visitors],['访问',data.totals.visit||0],['搜索',data.totals.search||0],['下载',data.totals.download||0],['缺书登记',data.totals.request||0],['读后感',data.totals.review||0]].forEach(function(x){stats.appendChild(text('div',x[0]+'：'+x[1],'stat'))});cardList.replaceChildren();(data.cards||[]).forEach(function(c,index){var tr=document.createElement('tr'),reader=c.card_type==='reader',quota=reader?('至 '+(c.expires_at||'未设置').slice(0,10)):('剩余 '+c.remaining+'/'+c.download_limit),status=!c.active?'已停用':(reader?(c.expires_at>new Date().toISOString()?'可阅读':'已过期'):(c.remaining>0?'可下载':'已用完'));[index+1,c.code,reader?'阅读卡':'下载卡',quota,c.used,status,c.created_at.slice(0,19).replace('T',' ')].forEach(function(v,i){var td=text('td',v);if(i===1){var code=document.createElement('code');code.textContent=v;td.replaceChildren(code)}tr.appendChild(td)});var action=document.createElement('td'),copy=document.createElement('button');copy.type='button';copy.className='copy-btn';copy.textContent='复制';copy.onclick=function(){copyText(c.code,copy)};action.appendChild(copy);tr.appendChild(action);cardList.appendChild(tr)});bookRequests.replaceChildren();(data.requests||[]).forEach(function(x){var d=document.createElement('article');d.className='item';d.append(text('h3','《'+x.title+'》'),text('div',x.created_at,'muted'),text('p','作者：'+(x.author||'未知')));bookRequests.appendChild(d)});if(!(data.requests||[]).length){bookRequests.appendChild(text('p','暂时没有缺书登记。','muted'))}events.replaceChildren();data.recent.forEach(function(x){var d=document.createElement('div');d.className='item';d.append(text('strong',x.type+' · '+x.detail),text('div',x.created_at+' · 访客 '+x.visitor.slice(0,10),'muted'));events.appendChild(d)});reviews.replaceChildren();data.reviews.forEach(function(x){var d=document.createElement('article');d.className='item';d.append(text('h3',(x.title||'无题')+' · 《'+x.book+'》'),text('div',x.created_at+' · 访客 '+x.visitor.slice(0,10),'muted'),text('p',x.body,'review-body'));reviews.appendChild(d)})}
function load(){fetch('/api/admin/data').then(function(r){if(!r.ok)throw 0;return r.json()}).then(render).catch(function(){login.hidden=false})}
document.getElementById('login-form').onsubmit=function(e){e.preventDefault();fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('admin-code').value})}).then(function(r){if(!r.ok)throw 0;document.getElementById('login-error').hidden=true;load()}).catch(function(){document.getElementById('login-error').hidden=false})};
function numberedCodes(){return lastGeneratedCodes.map(function(code,index){return (index+1)+'. '+code}).join('\n')}
function createCards(payload,label){cardError.hidden=true;fetch('/api/admin/cards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(data){lastGeneratedCodes=data.codes||[];cardResult.hidden=false;cardResultTools.hidden=!lastGeneratedCodes.length;cardResult.replaceChildren(text('p','已生成 '+lastGeneratedCodes.length+' 张'+label+'：','generated-title'));lastGeneratedCodes.forEach(function(code,index){var row=document.createElement('div');row.className='generated-card';var no=text('span',(index+1)+'.','generated-no'),value=document.createElement('code'),copy=document.createElement('button');value.textContent=code;copy.type='button';copy.className='copy-btn';copy.textContent='复制';copy.onclick=function(){copyText(code,copy)};row.append(no,value,copy);cardResult.appendChild(row)});load()}).catch(function(){cardError.hidden=false;cardError.textContent='生成失败，请确认数量填写正确。'})}
copyAllCards.onclick=function(){if(lastGeneratedCodes.length)copyText(numberedCodes(),copyAllCards)};
document.getElementById('download-card-form').onsubmit=function(e){e.preventDefault();createCards({cardType:'download',count:Number(document.getElementById('download-card-count').value),downloadLimit:Number(document.getElementById('card-limit').value)},'下载卡')};
document.getElementById('reader-card-form').onsubmit=function(e){e.preventDefault();createCards({cardType:'reader',count:Number(document.getElementById('reader-card-count').value),months:Number(document.getElementById('reader-card-months').value)},'阅读卡')};
document.getElementById('upload-form').onsubmit=function(e){e.preventDefault();var file=document.getElementById('upload-file').files[0],message=document.getElementById('upload-message');if(!file)return;message.textContent='上传中…';fetch('/api/admin/upload',{method:'POST',headers:{'X-Filename':encodeURIComponent(file.name)},body:file}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(){message.textContent='上传成功，书目将在数秒内更新。'}).catch(function(){message.textContent='上传失败，请检查格式或文件大小。'})};
document.getElementById('password-form').onsubmit=function(e){e.preventDefault();var first=document.getElementById('new-admin-password'),second=document.getElementById('confirm-admin-password'),message=document.getElementById('password-message');message.hidden=false;if(first.value!==second.value){message.textContent='两次输入的密码不一致。';return}fetch('/api/admin/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({newPassword:first.value})}).then(function(r){if(!r.ok)throw 0;message.textContent='管理员密码已修改。';first.value='';second.value=''}).catch(function(){message.textContent='修改失败，密码至少需要 8 位。'})};
initCollapsibles();load();setInterval(function(){if(!dashboard.hidden)load()},15000)})();
</script></body></html>
