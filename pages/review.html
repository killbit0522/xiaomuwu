/* ==========================================================================
   Palette note
   These tokens are sampled from the artwork supplied for this project, not
   invented. Measured mean colours of the source images:
     IMG_1939 home hero        #766952   (dark warm olive)
     IMG_1948 home fill        #ccc9c3   (neutral warm grey)
     IMG_1949 left rail/search #c2bfba   (neutral warm grey)
     IMG_1950 catalog          #dfdcd5   (pale neutral grey)
     IMG_1950-2 request        #c7c4be   (neutral warm grey)
     IMG_1952 review           #f3f3f3   (near white)
     IMG_1947 birds            #e8e9e9   (near white)
   The artwork is neutral paper, so the page base is a neutral paper grey.
   No cream / yellow cast is applied anywhere.
   ========================================================================== */

:root {
  /* Neutral paper base taken from the artwork itself */
  --zhaowen-background: #c9c5be;
  --zhaowen-foreground: #1c1a17;

  --zhaowen-card: #f2efe9;
  --zhaowen-card-foreground: #1c1a17;
  --zhaowen-popover: #f7f5f0;
  --zhaowen-popover-foreground: #1c1a17;

  /* Ink, not red. Buttons are transparent with black text. */
  --zhaowen-primary: #1c1a17;
  --zhaowen-primary-foreground: #f7f5f0;

  --zhaowen-muted: #d9d5ce;
  --zhaowen-muted-foreground: #5f5a52;
  --zhaowen-border: rgba(28, 26, 23, 0.22);
  --zhaowen-input: rgba(28, 26, 23, 0.06);
  --zhaowen-ring: #1c1a17;

  /* Radius scale - restrained */
  --zhaowen-radius-sm: 3px;
  --zhaowen-radius-md: 6px;
  --zhaowen-radius-lg: 14px;

  /* Semantic surfaces */
  --zhaowen-surface-1: #d5d1ca;
  --zhaowen-surface-2: #dedad3;
  --zhaowen-surface-3: #e7e3dc;
  --zhaowen-ink-1: #1c1a17;
  --zhaowen-ink-2: #443f38;
  --zhaowen-ink-3: #6b655c;
  --zhaowen-line: rgba(28, 26, 23, 0.22);

  /* Per-page base tone. Each page overrides this with the tone of the
     artwork used on that page, so the page never fights its own image. */
  --zhaowen-page-base: #c9c5be;
  /* How strongly the artwork shows through. Kept high so images are not washed out. */
  --zhaowen-art-opacity: 0.92;
  --zhaowen-art-blur: 0px;

  /* Secondary accent kept neutral; legacy name retained for compatibility */
  --zhaowen-seal: #1c1a17;
  --zhaowen-ink-blue: #2f3a3d;
  --zhaowen-gold: #6d6450;

  /* Neutral whites: paper glow washes and the 木木书屋 orb shell.
     Declared here so page HTML/CSS never needs a literal colour value. */
  --zhaowen-glow: #ffffff;
  --zhaowen-orb-base: #f1efeb;
  --zhaowen-orb-highlight: #fdfcfa;
  --zhaowen-orb-shade: #dcd8d1;

  /* Layout rhythm */
  --zhaowen-section-gap: 2.5rem;
  --zhaowen-card-pad: 1.5rem;

  /* Typography
     Display = Mincho (明朝体); Body = Source Han Serif (思源宋体). */
  --zhaowen-font-display: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Hiragino Mincho Pro",
    "MS PMincho", "Source Han Serif SC", "Noto Serif SC", "Songti SC", "SimSun", serif;
  --zhaowen-font-serif: "Source Han Serif SC", "Noto Serif SC", "Source Han Serif",
    "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Songti SC", "STSong", "SimSun", serif;
  --zhaowen-font-sans: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --zhaowen-font-mono: "JetBrains Mono", "SF Mono", "Fira Code", monospace;

  /* Slightly reduced type scale */
  --zhaowen-text-xs: 0.68rem;
  --zhaowen-text-sm: 0.78rem;
  --zhaowen-text-base: 0.88rem;
  --zhaowen-text-lg: 1.02rem;
  --zhaowen-text-xl: 1.3rem;
  --zhaowen-text-2xl: 1.72rem;
  --zhaowen-text-3xl: 2.05rem;
}

html {
  color-scheme: light;
}

body {
  font-family: var(--zhaowen-font-serif);
  background-color: var(--zhaowen-page-base);
  color: var(--zhaowen-foreground);
  font-size: var(--zhaowen-text-base);
}

h1, h2, h3, h4 {
  font-family: var(--zhaowen-font-display);
  font-weight: 500;
}

<body class="sh-body">
<style id="critical-layout">
  /* 本页兜底色取自 review-bg.jpg 实测均值 #f3f3f3（近纯白，非米黄） */
  :root {
    --zhaowen-page-base: #f3f3f3;
    --zhaowen-art-opacity: 0.94;
  }

  *, *::before, *::after { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html { background: var(--zhaowen-page-base); }

  body.sh-body {
    margin: 0;
    min-height: 100vh;
    max-width: 100%;
    background: var(--zhaowen-page-base);
    color: var(--zhaowen-ink-1);
    font-family: var(--zhaowen-font-serif);
    font-size: 0.88rem;
    line-height: 1.86;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .sh-shell :focus-visible {
    outline: 2px solid var(--zhaowen-primary);
    outline-offset: 2px;
    border-radius: var(--zhaowen-radius-sm);
  }

  /* 图标基座：lucide 未加载时也占位不塌陷 */
  .sh-nav-ico {
    display: inline-block;
    width: 18px;
    height: 18px;
    flex: 0 0 auto;
    color: inherit;
  }

  /* ---------------- 共享外壳：左栏 sticky + 右栏文档流 ---------------- */
  .sh-shell {
    display: flex;
    align-items: flex-start;
    width: 100%;
    max-width: 100%;
    min-height: 100vh;
    background: var(--zhaowen-page-base);
  }

  .sh-side {
    position: sticky;
    top: 0;
    flex: 0 0 300px;
    width: 300px;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--zhaowen-line);
    background-color: var(--zhaowen-page-base);
    isolation: isolate;
    z-index: 6;
  }
  .sh-side::-webkit-scrollbar { width: 6px; }
  .sh-side::-webkit-scrollbar-track { background: transparent; }
  .sh-side::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--zhaowen-ink-3) 40%, transparent);
    border-radius: 3px;
  }

  /* 左栏底图：multiply 与主栏白底咬合；仅四边最外 8%~10% 羽化，中心清晰 */
  .sh-side-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image: url("../assets/sidebar-bg.jpg");
    background-size: cover;
    background-position: center 28%;
    background-repeat: no-repeat;
    opacity: var(--zhaowen-art-opacity);
    mix-blend-mode: multiply;
    pointer-events: none;
    -webkit-mask-image:
      linear-gradient(to bottom, transparent 0%, #000 9%, #000 91%, transparent 100%),
      linear-gradient(to right, transparent 0%, #000 8%, #000 90%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to bottom, transparent 0%, #000 9%, #000 91%, transparent 100%),
      linear-gradient(to right, transparent 0%, #000 8%, #000 90%, transparent 100%);
    mask-composite: intersect;
  }

  /* 文字局部柔光垫：径向羽化，恰好包住导航文字块并向外渐隐，不整幅压盖 */
  .sh-side-veil {
    position: absolute;
    left: -6%;
    right: -6%;
    top: 4%;
    bottom: 4%;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(
      68% 58% at 46% 48%,
      color-mix(in srgb, var(--zhaowen-page-base) 72%, transparent) 0%,
      color-mix(in srgb, var(--zhaowen-page-base) 44%, transparent) 54%,
      transparent 100%
    );
  }

  .sh-side-inner {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    min-height: 100vh;
    padding: 1.9rem 1.3rem 1.6rem;
  }

  /* 品牌区 */
  .sh-brand {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding-bottom: 1.3rem;
    border-bottom: 1px solid var(--zhaowen-line);
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .sh-brand:focus-visible { outline: 2px solid var(--zhaowen-ink-1); outline-offset: 3px; }
  .sh-seal {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--zhaowen-ink-1);
    font-family: var(--zhaowen-font-display);
    font-size: 1.28rem;
    line-height: 1;
    border: 1px solid var(--zhaowen-ink-1);
    border-radius: var(--zhaowen-radius-sm);
  }
  .sh-brand-text { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
  .sh-brand-title {
    font-family: var(--zhaowen-font-display);
    font-size: 1.12rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    line-height: 1.2;
    color: var(--zhaowen-ink-1);
  }
  .sh-brand-sub {
    font-family: var(--zhaowen-font-sans);
    font-size: 0.7rem;
    letter-spacing: 0.13em;
    color: var(--zhaowen-ink-3);
  }

  /* 导航 */
  .sh-nav {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .sh-nav-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.95rem 0.9rem 0.95rem 1.05rem;
    border-top: 1px solid var(--zhaowen-line);
    color: var(--zhaowen-ink-2);
    text-decoration: none;
    transition: transform 0.18s ease, background-color 0.18s ease, color 0.18s ease;
  }
  .sh-nav-btn:last-child { border-bottom: 1px solid var(--zhaowen-line); }
  .sh-nav-btn::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--zhaowen-primary);
    opacity: 0;
    transition: opacity 0.18s ease;
  }
  .sh-nav-btn:hover {
    transform: translateX(2px);
    background: color-mix(in srgb, var(--zhaowen-ink-1) 5%, transparent);
    color: var(--zhaowen-ink-1);
  }
  .sh-nav-btn:hover::before { opacity: 1; }
  .sh-nav-btn.is-active {
    background: color-mix(in srgb, var(--zhaowen-ink-1) 8%, transparent);
    color: var(--zhaowen-ink-1);
    font-weight: 600;
  }
  .sh-nav-btn.is-active::before { opacity: 1; }
  .sh-nav-label {
    flex: 1 1 auto;
    min-width: 0;
    font-family: var(--zhaowen-font-serif);
    font-size: 0.94rem;
    letter-spacing: 0.1em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sh-nav-en {
    flex: 0 0 auto;
    font-family: var(--zhaowen-font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--zhaowen-ink-3);
  }

  /* 分类标签行 */
  .sh-cats {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    padding-top: 0.15rem;
  }
  .sh-cat {
    display: inline-block;
    padding: 0.26rem 0.68rem;
    border: 1px solid var(--zhaowen-ink-1);
    border-radius: 999px;
    background: transparent;
    font-family: var(--zhaowen-font-sans);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--zhaowen-ink-2);
  }

  .sh-side-foot {
    margin-top: auto;
    padding-top: 1.1rem;
    border-top: 1px solid var(--zhaowen-line);
    font-family: var(--zhaowen-font-sans);
    font-size: 0.68rem;
    line-height: 1.78;
    letter-spacing: 0.1em;
    color: var(--zhaowen-ink-3);
  }

  /* ---------------- 主栏 ---------------- */
  .sh-main {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    background: var(--zhaowen-page-base);
    isolation: isolate;
  }

  /* 两栏交界过渡带：把左栏灰调顺延进主栏，避免生硬色块分界 */
  .sh-main::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 160px;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(
      to right,
      color-mix(in srgb, var(--zhaowen-page-base) 74%, var(--zhaowen-ink-3)) 0,
      color-mix(in srgb, var(--zhaowen-page-base) 88%, var(--zhaowen-ink-3)) 42%,
      color-mix(in srgb, var(--zhaowen-page-base) 97%, var(--zhaowen-ink-3)) 74%,
      transparent 100%
    );
  }

  /* 满铺底图（唯一允许的绝对定位排版）；仅四边最外 8%~9% 羽化，中心清晰 */
  .rv-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .rv-bg-img {
    position: absolute;
    inset: -1px;
    background-image: url("../assets/review-bg.jpg");
    background-size: cover;
    background-position: center 42%;
    background-repeat: no-repeat;
    opacity: var(--zhaowen-art-opacity);
    mix-blend-mode: multiply;
    -webkit-mask-image:
      linear-gradient(to bottom, transparent 0%, #000 9%, #000 91%, transparent 100%),
      linear-gradient(to right, transparent 0%, #000 8%, #000 92%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to bottom, transparent 0%, #000 9%, #000 91%, transparent 100%),
      linear-gradient(to right, transparent 0%, #000 8%, #000 92%, transparent 100%);
    mask-composite: intersect;
  }
  .rv-bg-texture {
    position: absolute;
    inset: 0;
    background-image: url("../assets/paper-texture.jpg");
    background-size: 420px 420px;
    background-repeat: repeat;
    opacity: 0.06;
    mix-blend-mode: multiply;
  }

  /* 内容层 */
  .rv-wrap {
    position: relative;
    z-index: 2;
    max-width: 860px;
    margin: 0 auto;
    padding: 4rem 2.5rem 4.5rem;
  }

  /* 标题块局部柔光垫：径向羽化，只垫在文字后面，不做整幅遮罩 */
  .rv-head { position: relative; }
  .rv-head::before {
    content: "";
    position: absolute;
    inset: -1.6rem -2rem -1.2rem -2rem;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(
      64% 132% at 46% 50%,
      color-mix(in srgb, var(--zhaowen-page-base) 94%, transparent) 0%,
      color-mix(in srgb, var(--zhaowen-page-base) 76%, transparent) 58%,
      transparent 100%
    );
  }

  .rv-kicker { margin: 0 0 1rem; }
  .rv-kicker-seal {
    display: inline-block;
    padding: 0.22rem 0.5rem 0.22rem 0.66rem;
    background: transparent;
    border: 1px solid var(--zhaowen-ink-1);
    color: var(--zhaowen-ink-1);
    font-family: var(--zhaowen-font-sans);
    font-size: 0.68rem;
    letter-spacing: 0.34em;
    border-radius: var(--zhaowen-radius-sm);
  }

  .rv-page-title {
    margin: 0;
    font-family: var(--zhaowen-font-display);
    font-size: 2.05rem;
    font-weight: 500;
    line-height: 1.28;
    letter-spacing: 0.16em;
    color: var(--zhaowen-ink-1);
  }
  .rv-lede {
    margin: 0.8rem 0 0;
    max-width: 34em;
    font-family: var(--zhaowen-font-serif);

<script>
(function () {
  var form = document.getElementById('review-form');
  if (!form) { return; }

  var titleEl = document.getElementById('rv-title');
  var bodyEl = document.getElementById('rv-body');
  var countEl = document.getElementById('rv-count');
  var errorEl = document.getElementById('rv-error');
  var toastEl = document.getElementById('rv-toast');
  var draftBtn = document.getElementById('rv-draft');
  var submitBtn = document.getElementById('rv-submit');
  var bookNow = document.getElementById('rv-book-now');
  var bookInput = document.getElementById('rv-book');
  var bookList = document.getElementById('rv-book-list');
  var DRAFT_KEY = 'zhaowen-review-draft';
  var submitTimer = null;
  var draftTimer = null;

  function countChars(value) {
    return (value || '').replace(/\s+/g, '').length;
  }

  function paintCount() {
    if (countEl && bodyEl) { countEl.textContent = '已写 ' + countChars(bodyEl.value) + ' 字'; }
  }

  function clearError() {
    if (errorEl) { errorEl.hidden = true; }
    if (bodyEl) { bodyEl.classList.remove('is-invalid'); }
  }

  function selectedBook() {
    return bookInput ? bookInput.value.trim() : '';
  }

  function setSelectedBook(name) {
    if(bookInput){bookInput.value=name||''} if(bookNow){bookNow.textContent=name||'请选择一本书'}
  }

  if(bookInput){bookInput.addEventListener('input',function(){if(bookNow){bookNow.textContent=bookInput.value.trim()||'请选择一本书'}})}
  fetch('../assets/catalog.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(items){var seen={};items.forEach(function(book){if(!seen[book.title]){seen[book.title]=true;var option=document.createElement('option');option.value=book.title;bookList.appendChild(option)}})}).catch(function(){});

  if (bodyEl) {
    bodyEl.addEventListener('input', function () {
      paintCount();
      clearError();
    });
  }
  if (titleEl) { titleEl.addEventListener('input', clearError); }

  form.addEventListener('submit', function (event) {
    event.preventDefault();

    if (!selectedBook()) { errorEl.textContent='请先选择或填写所读之书。';errorEl.hidden=false;bookInput.focus();return; }
    if (countChars(bodyEl.value) < 10) {
      errorEl.textContent='至少写下十个字。';
      if (errorEl) { errorEl.hidden = false; }
      bodyEl.classList.add('is-invalid');
      bodyEl.focus();
      return;
    }

    clearError();
    var visitor = 'visitor';
    try { var visitorKey='cabin-visitor-id'; visitor=localStorage.getItem(visitorKey)||Math.random().toString(36).slice(2); localStorage.setItem(visitorKey,visitor); } catch(err){}
    submitBtn.disabled = true;
    submitBtn.textContent = '提交中…';
    fetch('/api/reviews', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ book: selectedBook(), title: titleEl ? titleEl.value : '', body: bodyEl.value, visitor: visitor }) })
      .then(function(response){ if(!response.ok){throw new Error('submit')} if(toastEl){toastEl.hidden=false} submitBtn.textContent='已提交'; bodyEl.value=''; paintCount(); })
      .catch(function(){ errorEl.textContent='提交失败，请确认网站服务正在运行。'; errorEl.hidden=false; submitBtn.textContent='重新提交'; })
      .finally(function(){ submitBtn.disabled=false; });
  });

  if (draftBtn) {
    draftBtn.addEventListener('click', function () {
      try {
        window.localStorage.setItem(DRAFT_KEY, JSON.stringify({
          book: selectedBook(),
          title: titleEl ? titleEl.value : '',
          body: bodyEl ? bodyEl.value : ''
        }));
      } catch (err) { /* 存储不可用时静默降级 */ }

      var label = draftBtn.textContent;
      draftBtn.textContent = '已存';
      if (draftTimer) { clearTimeout(draftTimer); }
      draftTimer = setTimeout(function () { draftBtn.textContent = label; }, 1500);
    });
  }

  try {
    var raw = window.localStorage.getItem(DRAFT_KEY);
    if (raw) {
      var saved = JSON.parse(raw);
      if (saved && typeof saved === 'object') {
        if (saved.book) { setSelectedBook(saved.book); }
        if (typeof saved.title === 'string' && titleEl) { titleEl.value = saved.title; }
        if (typeof saved.body === 'string' && bodyEl) { bodyEl.value = saved.body; }
      }
    }
  } catch (err) { /* 忽略损坏的草稿 */ }

  paintCount();
})();
</script>
