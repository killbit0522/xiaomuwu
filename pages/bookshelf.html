<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>小木屋 · 我的书架</title>
  <link rel="stylesheet" href="../site-preferences.css?v=20261006-1">
  <script src="../shelf-store.js?v=20261009-1"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:#26231f;font-family:serif;background:#d8d4cb url('../assets/bookshelf-bg.webp') center/cover fixed}
    .veil{min-height:100vh;background:rgba(244,241,233,.32);padding:22px 14px}.wrap{max-width:1050px;margin:auto}
    .head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{margin:.2em 0}.head p{margin:0}.head a{color:inherit;white-space:nowrap}
    .shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:24px}
    .book{display:flex;min-width:0;min-height:112px;flex-direction:column;background:rgba(30,29,27,.86);color:#eee9df;padding:13px;border:1px solid #fff4;box-shadow:0 7px 18px #0003}
    .book h2{display:-webkit-box;overflow:hidden;margin:0 0 7px;font-size:1rem;line-height:1.4;-webkit-box-orient:vertical;-webkit-line-clamp:2;word-break:break-word}
    .book p{overflow:hidden;margin:0 0 10px;font-size:.75rem;line-height:1.4;opacity:.72;text-overflow:ellipsis;white-space:nowrap}.book a{margin-top:auto;color:inherit;font-size:.86rem}
    .book button{align-self:flex-start;margin-top:8px;padding:5px 7px;border:1px solid #fff6;background:transparent;color:inherit;font-size:.72rem}.empty{padding:30px;background:#f4f1e9cc}
    @media(max-width:520px){.veil{padding:14px 7px}.head{padding:0 5px}.head h1{font-size:1.5rem}.head p{font-size:.75rem}.shelf{gap:6px;margin-top:16px}.book{min-height:105px;padding:9px}.book h2{font-size:.82rem}.book p{font-size:.65rem}.book a{font-size:.75rem}.book button{font-size:.65rem;padding:4px 5px}}
  </style>
</head>
<body><div class="veil"><main class="wrap"><header class="head"><div><p>生命流逝里寻找</p><h1>我的书架</h1></div><a href="./search.html">继续找书 →</a></header><section id="shelf" class="shelf"></section></main></div>
<script>(function(){var root=document.getElementById('shelf');fetch('/api/access').then(function(r){return r.json()}).then(function(a){if(!a.ok||a.cardType!=='reader'){root.className='empty';root.textContent='书架仅供有效阅读卡使用。';return}var books=[];try{books=JSON.parse(localStorage.getItem('xiaomuwu-shelf')||'[]')}catch(e){}if(!books.length){root.className='empty';root.textContent='书架还是空的，可以在找书页面把本地书加入书架。';return}books.forEach(function(book){var card=document.createElement('article');card.className='book';var h=document.createElement('h2');h.textContent='《'+book.title+'》';h.title=book.title;var p=document.createElement('p');p.textContent=book.category||'未分类';p.title=book.category||'未分类';var a=document.createElement('a');a.textContent='开始阅读';var readerParams={p:book.searchablePath,title:book.title,format:book.format||'txt'};if(book.onlineId){readerParams.onlineId=book.onlineId;readerParams.source=book.source||'';readerParams.sourceUrl=book.sourceUrl||''}a.href='./reader.html?'+new URLSearchParams(readerParams);var del=document.createElement('button');del.type='button';del.textContent='移出书架';del.onclick=function(){books=books.filter(function(x){return x.searchablePath!==book.searchablePath});localStorage.setItem('xiaomuwu-shelf',JSON.stringify(books));card.remove()};card.append(h,p,a,del);root.appendChild(card)})}).catch(function(){root.className='empty';root.textContent='书架载入失败，请刷新重试。'})})();</script>
<script src="../recent-reading.js?v=20261001-1"></script></body></html>
