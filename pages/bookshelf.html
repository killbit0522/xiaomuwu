<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小木屋 · 我的书架</title><link rel="stylesheet" href="../site-preferences.css"><style>body{margin:0;min-height:100vh;color:#26231f;font-family:serif;background:#d8d4cb url('../assets/bookshelf-bg.jpg') center/cover fixed}.veil{min-height:100vh;background:rgba(244,241,233,.32);padding:28px;box-sizing:border-box}.wrap{max-width:1050px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.head a{color:inherit}.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;margin-top:40px}.book{background:rgba(30,29,27,.84);color:#eee9df;padding:22px;min-height:160px;border:1px solid #fff4;box-shadow:0 12px 30px #0003}.book a{color:inherit}.book button{margin-top:15px;padding:7px 10px}.empty{padding:40px;background:#f4f1e9cc}</style></head><body><div class="veil"><main class="wrap"><header class="head"><div><p>生命流逝里寻找</p><h1>我的书架</h1></div><a href="./search.html">继续找书 →</a></header><section id="shelf" class="shelf"></section></main></div><script>(function(){var root=document.getElementById('shelf');fetch('/api/access').then(function(r){return r.json()}).then(function(a){if(!a.ok||a.cardType!=='reader'){root.className='empty';root.textContent='书架仅供有效阅读卡使用。';return}var books=[];try{books=JSON.parse(localStorage.getItem('xiaomuwu-shelf')||'[]')}catch(e){}if(!books.length){root.className='empty';root.textContent='书架还是空的，可以在找书页面把本地书加入书架。';return}books.forEach(function(book){var card=document.createElement('article');card.className='book';var h=document.createElement('h2');h.textContent='《'+book.title+'》';var p=document.createElement('p');p.textContent=book.category||'未分类';var a=document.createElement('a');a.textContent='开始阅读';a.href='./reader.html?p='+encodeURIComponent(book.searchablePath)+'&title='+encodeURIComponent(book.title)+'&format='+encodeURIComponent(book.format);var del=document.createElement('button');del.textContent='移出书架';del.onclick=function(){books=books.filter(function(x){return x.searchablePath!==book.searchablePath});localStorage.setItem('xiaomuwu-shelf',JSON.stringify(books));card.remove()};card.append(h,p,a,document.createElement('br'),del);root.appendChild(card)})}).catch(function(){root.textContent='书架载入失败。'})})();</script></body></html>
